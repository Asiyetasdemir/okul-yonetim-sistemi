<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduMercek | Giriş Yap</title>
    <!-- Google Fonts Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root {
        --bg-gradient: radial-gradient(circle at 0% 0%, #151d30 0%, #0a0e17 100%);
        --card-bg: rgba(18, 26, 44, 0.65);
        --color-primary: #ff5a36;
        --color-primary-glow: rgba(255, 90, 54, 0.15);
        --text-color: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: rgba(255, 255, 255, 0.08);
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Outfit', sans-serif;
        background: var(--bg-gradient);
        color: var(--text-color);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* Background Glow Elements */
      body::before, body::after {
        content: '';
        position: absolute;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        filter: blur(120px);
        z-index: 0;
        opacity: 0.4;
      }
      body::before {
        background: var(--color-primary);
        top: -100px;
        left: -100px;
      }
      body::after {
        background: #3b82f6;
        bottom: -100px;
        right: -100px;
      }

      .login-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 420px;
        padding: 24px;
        box-sizing: border-box;
      }

      .login-card {
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 40px 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        gap: 28px;
        transition: all 0.3s ease;
      }

      .login-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }

      .logo-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logo-icon {
        height: 48px;
        width: 48px;
        object-fit: contain;
      }

      .logo-text {
        height: 24px;
        width: auto;
        object-fit: contain;
      }

      .login-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin: 0;
      }

      .login-subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin: 0;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
      }

      .form-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-wrapper i {
        position: absolute;
        left: 14px;
        color: var(--text-muted);
        width: 18px;
        height: 18px;
      }

      .form-input {
        width: 100%;
        padding: 14px 14px 14px 44px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: rgba(10, 14, 23, 0.5);
        color: #ffffff;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        box-sizing: border-box;
        transition: all 0.2s ease;
      }

      .form-input:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px var(--color-primary-glow);
        background: rgba(10, 14, 23, 0.8);
      }

      .login-btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        background: var(--color-primary);
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 8px 20px rgba(255, 90, 54, 0.25);
      }

      .login-btn:hover {
        background: #ff7252;
        transform: translateY(-2px);
      }

      .login-btn:active {
        transform: translateY(0);
      }

      .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .alert {
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
        display: none;
        align-items: center;
        gap: 8px;
        line-height: 1.4;
      }

      .alert-error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #ef4444;
      }

      /* Spinner Animation */
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: none;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo-group">
            <img src="/src/assets/logo-dark-icon.jpg" alt="EduMercek" class="logo-icon">
            <img src="/src/assets/logo-dark.jpg" alt="EduMercek Logo" class="logo-text">
          </div>
          <h1 class="login-title">Giriş Yap</h1>
          <p class="login-subtitle">Okul ve Etüt Otomasyon Paneli</p>
        </div>

        <div id="error-alert" class="alert alert-error">
          <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
          <span id="error-message">Hata oluştu.</span>
        </div>

        <form id="login-form" style="display: flex; flex-direction: column; gap: 20px;">
          <div class="form-group">
            <label class="form-label" for="email">E-Posta Adresi</label>
            <div class="input-wrapper">
              <i data-lucide="mail"></i>
              <input type="email" id="email" class="form-input" placeholder="ornek@edumercek.com" required autocomplete="username">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Şifre</label>
            <div class="input-wrapper">
              <i data-lucide="lock"></i>
              <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>
          </div>

          <button type="submit" id="submit-btn" class="login-btn">
            <span class="spinner" id="btn-spinner"></span>
            <span id="btn-text">Giriş Yap</span>
          </button>
        </form>
      </div>
    </div>

    <script type="module">
      import { login } from './src/lib/auth.js';

      // Initialize lucide icons
      if (window.lucide) {
        window.lucide.createIcons();
      }

      const loginForm = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submit-btn');
      const btnSpinner = document.getElementById('btn-spinner');
      const btnText = document.getElementById('btn-text');
      const errorAlert = document.getElementById('error-alert');
      const errorMessage = document.getElementById('error-message');

      function showError(msg) {
        errorMessage.textContent = msg;
        errorAlert.style.display = 'flex';
      }

      function hideError() {
        errorAlert.style.display = 'none';
      }

      function setSubmitting(isSubmitting) {
        submitBtn.disabled = isSubmitting;
        if (isSubmitting) {
          btnSpinner.style.display = 'block';
          btnText.textContent = 'Giriş Yapılıyor...';
        } else {
          btnSpinner.style.display = 'none';
          btnText.textContent = 'Giriş Yap';
        }
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();
        setSubmitting(true);

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        try {
          const profile = await login(email, password);
          if (profile) {
            // Başarılı giriş, ana panele yönlendir
            window.location.href = '/index.html';
          } else {
            showError('Kullanıcı profili yüklenemedi. Lütfen yöneticinizle görüşün.');
            setSubmitting(false);
          }
        } catch (err) {
          console.error(err);
          showError(err.message || 'Giriş başarısız. Lütfen e-posta ve şifrenizi kontrol edin.');
          setSubmitting(false);
        }
      });
    </script>
  </body>
</html>
